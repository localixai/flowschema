# The quick loop (src/main.rs): a crate of its own with flowschema and serde_json alone, so a
# change to the library rebuilds in seconds, with no reference validator to link.
[package]
name = "flowschema-quick"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
flowschema = { path = "../.." }
serde_json = "1.0.154"

# As the bench crate is built for speed: one codegen unit, fat LTO, a panic unwinding, line tables
# for the profiler.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
