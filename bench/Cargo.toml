# flowschema's benchmarks and conformance runs, against the Rust crate `jsonschema`.
# A crate of its own, outside the library: `jsonschema` and the corpora never reach its build.
[package]
name = "flowschema-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
flowschema = { path = ".." }
serde_json = "1.0.154"
jsonschema = { version = "0.60", default-features = false }

# Built for speed, as a release is built where speed matters: one codegen unit, fat LTO, a panic
# unwinding. The size is measured apart, built for size (size/).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
debug = 1
