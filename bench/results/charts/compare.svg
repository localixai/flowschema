<text x="828" y="95" class="note">a union of 8 tools, compiled</text>
<text x="910" y="129" text-anchor="end" class="ours">flowschema</text>
<rect x="920" y="117" width="41.4" height="16" rx="3" fill="#6e56cf"/>
