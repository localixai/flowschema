<text x="0" y="225" class="note">one check of what a model wrote, the median of 31 rounds · shorter is better</text>
<line x1="0" y1="236" x2="1200" y2="236" stroke="#d6d6d3"/>
<text x="0" y="266" class="title">A structured answer</text>
<text x="0" y="285" class="note">a review's verdict, valid</text>
<text x="82" y="319" text-anchor="end" class="ours">flowschema</text>
<rect x="92" y="307" width="124.9" height="16" rx="3" fill="#6e56cf"/>
<text x="224.9376745165198" y="319" class="ours">110 ns</text>
