<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="1002" viewBox="0 0 1272 1002">
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1c1c1b; }
.section { font-size: 17px; font-weight: 700; }
.title { font-size: 15px; font-weight: 600; }
.note { font-size: 12px; fill: #5f5f5b; }
.label, .value { font-size: 12.5px; }
.value { fill: #5f5f5b; font-variant-numeric: tabular-nums; }
.ours { font-size: 12.5px; font-weight: 600; fill: #6e56cf; font-variant-numeric: tabular-nums; }
</style></defs>
<rect width="1272" height="1002" rx="16" fill="#ffffff"/>
<g transform="translate(36 36)">
<text x="0" y="16" class="section">A request</text>
<text x="0" y="35" class="note">a schema that comes with the request, compiled, and one answer checked · shorter is better</text>
