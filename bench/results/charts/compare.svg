<text x="828" y="611" class="note">answers judged against their label, of 36,990</text>
<text x="910" y="645" text-anchor="end" class="ours">flowschema</text>
<rect x="920" y="633" width="56.4" height="16" rx="3" fill="#6e56cf"/>
<text x="984.4" y="645" class="ours">6</text>
